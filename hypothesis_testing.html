<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hypothesis Testing Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9fbfd;
      padding: 30px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hypotheses {
      text-align: center;
      margin-bottom: 20px;
      font-size: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .controls div {
      background: #fff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.07);
      text-align: center;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      margin-top: 5px;
      width: 80px;
      padding: 5px;
      font-size: 14px;
      text-align: center;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    canvas {
      max-width: 850px;
      margin: auto;
      display: block;
    }

    .result {
      font-size: 20px;
      text-align: center;
      margin-top: 25px;
      font-weight: bold;
    }

    .tooltip {
      border-bottom: 1px dotted #555;
      cursor: help;
    }
  </style>
</head>
<body>

  <h1>Hypothesis Testing Simulator</h1>

  <div class="hypotheses">
    <p>
      <span class="tooltip" title="Assumes no effect or no difference (μ = μ₀)">Null Hypothesis (H₀): μ = μ₀</span> &nbsp;&nbsp;|&nbsp;&nbsp;
      <span class="tooltip" title="Indicates presence of effect or difference">Alternative Hypothesis (H₁): μ ≠ μ₀ / μ &lt; μ₀ / μ &gt; μ₀</span>
    </p>
  </div>

  <div class="controls">
    <div>
      <label title="Mean of the population under the null hypothesis">Population Mean (μ₀)</label><br>
      <input type="number" id="popMean" value="100">
    </div>
    <div>
      <label title="Mean calculated from sample data">Sample Mean (x̄)</label><br>
      <input type="number" id="sampleMean" value="104">
    </div>
    <div>
      <label title="Standard deviation of population (σ)">Standard Deviation (σ)</label><br>
      <input type="number" id="stdDev" value="15">
    </div>
    <div>
      <label title="Number of data points in sample">Sample Size (n)</label><br>
      <input type="number" id="sampleSize" value="30">
    </div>
    <div>
      <label title="Significance level (α), probability of rejecting H₀ when true">Significance Level (α)</label><br>
      <input type="number" id="alpha" value="0.05" step="0.01" min="0.01" max="0.2">
    </div>
    <div>
      <label title="Select the tail type based on H₁">Test Type</label><br>
      <select id="testType">
        <option value="two">Two-Tailed</option>
        <option value="left">Left-Tailed</option>
        <option value="right">Right-Tailed</option>
      </select>
    </div>
  </div>

  <canvas id="chart" width="800" height="400"></canvas>

  <div class="result" id="decision">Decision: ...</div>

  <script>
    const popMeanInput = document.getElementById("popMean");
    const sampleMeanInput = document.getElementById("sampleMean");
    const stdDevInput = document.getElementById("stdDev");
    const sampleSizeInput = document.getElementById("sampleSize");
    const alphaInput = document.getElementById("alpha");
    const testTypeInput = document.getElementById("testType");
    const decisionDiv = document.getElementById("decision");
    const ctx = document.getElementById('chart').getContext('2d');
    let chart;

    function normalPDF(x, mean, std) {
      const exponent = -0.5 * Math.pow((x - mean) / std, 2);
      return (1 / (std * Math.sqrt(2 * Math.PI))) * Math.exp(exponent);
    }

    function normInv(p) {
      const a = [2.50662823884, -18.61500062529, 41.39119773534, -25.44106049637];
      const b = [-8.47351093090, 23.08336743743, -21.06224101826, 3.13082909833];
      const c = [0.3374754822726147, 0.9761690190917186, 0.1607979714918209,
        0.0276438810333863, 0.0038405729373609, 0.0003951896511919,
        0.0000321767881768, 0.0000002888167364, 0.0000003960315187];
      if (p <= 0) return -Infinity;
      if (p >= 1) return Infinity;
      let x = p - 0.5;
      if (Math.abs(x) < 0.42) {
        const r = x * x;
        const num = x * (((a[3] * r + a[2]) * r + a[1]) * r + a[0]);
        const den = (((b[3] * r + b[2]) * r + b[1]) * r + b[0]) * r + 1;
        return num / den;
      } else {
        let r = x > 0 ? 1 - p : p;
        r = Math.log(-Math.log(r));
        let val = c[0];
        for (let i = 1; i < c.length; i++) val += c[i] * Math.pow(r, i);
        return x < 0 ? -val : val;
      }
    }

    function updateChart() {
      const μ0 = parseFloat(popMeanInput.value);
      const x̄ = parseFloat(sampleMeanInput.value);
      const σ = parseFloat(stdDevInput.value);
      const n = parseFloat(sampleSizeInput.value);
      const α = parseFloat(alphaInput.value);
      const testType = testTypeInput.value;

      const stdErr = σ / Math.sqrt(n);
      const z = (x̄ - μ0) / stdErr;

      let zCritLeft = 0, zCritRight = 0, reject = false;

      if (testType === "two") {
        zCritLeft = normInv(α / 2);
        zCritRight = normInv(1 - α / 2);
        reject = z < zCritLeft || z > zCritRight;
      } else if (testType === "left") {
        zCritLeft = normInv(α);
        reject = z < zCritLeft;
      } else {
        zCritRight = normInv(1 - α);
        reject = z > zCritRight;
      }

      decisionDiv.innerHTML = `Z = ${z.toFixed(3)} → <span style="color:${reject ? 'green' : 'red'}">Decision: ${reject ? "Reject H₀" : "Fail to Reject H₀"}</span>`;

      const xVals = [], yVals = [];
      const minX = μ0 - 4 * stdErr, maxX = μ0 + 4 * stdErr;

      for (let i = minX; i <= maxX; i += stdErr / 40) {
        xVals.push(i);
        yVals.push(normalPDF(i, μ0, stdErr));
      }

      const annotations = {
        type: 'line',
        borderColor: 'red',
        borderWidth: 2,
        scaleID: 'x',
        value: x̄,
        label: {
          enabled: true,
          content: `x̄ = ${x̄}`,
          position: 'end'
        }
      };

      const rejectionRegions = [];

      if (testType === "two") {
        const left = μ0 + zCritLeft * stdErr;
        const right = μ0 + zCritRight * stdErr;
        rejectionRegions.push({
          type: 'box',
          xMin: minX,
          xMax: left,
          backgroundColor: 'rgba(255,99,132,0.3)'
        }, {
          type: 'box',
          xMin: right,
          xMax: maxX,
          backgroundColor: 'rgba(255,99,132,0.3)'
        });
      } else if (testType === "left") {
        const left = μ0 + zCritLeft * stdErr;
        rejectionRegions.push({
          type: 'box',
          xMin: minX,
          xMax: left,
          backgroundColor: 'rgba(255,99,132,0.3)'
        });
      } else {
        const right = μ0 + zCritRight * stdErr;
        rejectionRegions.push({
          type: 'box',
          xMin: right,
          xMax: maxX,
          backgroundColor: 'rgba(255,99,132,0.3)'
        });
      }

      if (chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: xVals,
          datasets: [{
            label: 'Sampling Distribution',
            data: xVals.map((x, i) => ({ x: x, y: yVals[i] })),
            borderColor: '#3e95cd',
            borderWidth: 2,
            fill: false,
            tension: 0.25,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            annotation: {
              annotations: {
                sampleLine: annotations,
                ...Object.fromEntries(rejectionRegions.map((box, i) => [`reject${i}`, box]))
              }
            }
          },
          scales: {
            x: {
              type: 'linear',
              title: { display: true, text: 'x̄ (Sample Mean)' }
            },
            y: {
              title: { display: true, text: 'Probability Density' },
              beginAtZero: true
            }
          }
        }
      });
    }

    document.querySelectorAll("input, select").forEach(el => {
      el.addEventListener("input", updateChart);
    });

    updateChart();
  </script>

</body>
</html>
